name: Setup toolchain
description: Install mise, the tools pinned in .config/mise/config.toml, and the complete MoonBit toolchain.

inputs:
  github-token:
    description: Token for mise to query GitHub releases without rate limits.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install mise and pinned tools
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        curl -fsSL https://mise.run | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        mise --version
        mise trust
        mise install

    - name: Export the MoonBit toolchain
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        moonbit_dir="$(mise where http:moonbit)"
        echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

    - name: Report versions
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        moon version --all

    - name: Install mise and pinned tools on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_INSTALL_MODIFY_PATH: '0'
      run: |
        $ErrorActionPreference = 'Stop'
        Invoke-RestMethod https://mise.run/powershell | Invoke-Expression
        $miseBin = Join-Path $HOME '.local/bin'
        $env:PATH = "$miseBin;$env:PATH"
        $miseBin >> $env:GITHUB_PATH
        "$env:LOCALAPPDATA/mise/shims" >> $env:GITHUB_PATH
        mise --version
        mise trust
        mise install
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $moonbitDir = mise where http:moonbit
        "$moonbitDir/bin" >> $env:GITHUB_PATH
        "MOON_HOME=$moonbitDir" >> $env:GITHUB_ENV
        mise exec -- moon version --all
