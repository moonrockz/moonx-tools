# Release: plan, validate, publish, release.
#
# zig-cross distributes through mooncakes.io; the GitHub release holds notes
# only and no dist/ assets.
#
# The flow:
#   plan      decides if this run releases. It writes release, dry_run, version and tag.
#   validate  runs the full checks and the version check.
#   publish   publishes moonrockz/zig-cross to mooncakes.io. A version already published counts as done.
#   verify    runs the published CLI with moonx, with bounded retries for registry asset readiness.
#   release   creates the GitHub release with notes, or reports it complete.
#
# A pull request that changes release files, and a manual run with dry_run, run plan and validate
# only. They never run publish, verify, or release.
#
# Re-run failed jobs: after a transient failure, use "Re-run failed jobs" on the run. GitHub runs
# again the failed job and the jobs after it. publish is idempotent (already-published counts as
# done and transient network failures retry with backoff), so a retry after a partial publish
# continues where it stopped without replacing an immutable registry version.
# Release runs never overlap: they share one concurrency group. A pull request run has its own group.
# For a failure that is not transient, run `mise run release:status` first.

name: Release

on:
  push:
    branches: [main]
    paths: [moon.mod]
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.mbtx
      - scripts/publish.mbtx
      - scripts/versions.mbtx
      - scripts/credentials.mbtx
      - apps/zig-cross/**
      - .config/mise/config.toml
      - moon.mod
      - moon.work
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check, but do not publish or create a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: mise run release:plan

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.dry_run == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint, validate, test and build
        run: mise run check

      - name: Run the task script tests
        run: mise run test:scripts

      - name: Run the consumer cross-build and exec host
        run: mise run test:consumer

      - name: Check that every version is ${{ needs.plan.outputs.version }}
        run: moonx scripts/versions.mbtx check ${{ needs.plan.outputs.version }}

  publish:
    name: Publish to mooncakes.io
    runs-on: ubuntu-latest
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the mooncakes.io credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials

      - name: Publish the modules
        run: mise run release:publish

  verify:
    name: Verify published CLI
    runs-on: ubuntu-latest
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published CLI with moonx
        run: mise run release:verify-cli -- ${{ needs.plan.outputs.version }}

      - name: Consumer cross-build with the published tool
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if moonx "moonrockz/zig-cross@$VERSION" --version; then
              break
            fi
            echo "registry asset not ready (attempt $i/5); waiting 20s"
            sleep 20
          done
          moonx "moonrockz/zig-cross@$VERSION" --help
          moonx "moonrockz/zig-cross@$VERSION" build linux-x64 -- fixtures/consumer
          moonx "moonrockz/zig-cross@$VERSION" exec host -- moon test fixtures/consumer --target native

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise and the pinned toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the release notes
        run: mise run release:notes ${{ needs.plan.outputs.version }} > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:github ${{ needs.plan.outputs.version }}
